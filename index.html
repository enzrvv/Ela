<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Diary of Love</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
height:100dvh;
display:flex;
align-items:center;
justify-content:center;
background:#1c1412;
font-family:'Cormorant Garamond',serif;
overflow:hidden;
}

.screen{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
transition:.6s;
}

.hidden{opacity:0;pointer-events:none}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
padding:40px 25px;
border-radius:20px;
width:90%;
max-width:340px;
text-align:center;
border:1px solid rgba(255,255,255,.1);
}

h1{
font-family:'Great Vibes';
color:#e5b89d;
font-size:42px;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:none;
text-align:center;
font-size:18px;
margin-bottom:12px;
outline:none;
}

button{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#e5b89d;
font-weight:600;
cursor:pointer;
}

p{color:#e5b89d;margin-top:10px}

</style>
</head>

<body>

<div id="s1" class="screen">
<div class="card">
<h1>For my baby</h1>
<button onclick="goTo2()">Открыть</button>
</div>
</div>

<div id="s2" class="screen hidden">
<div class="card">
<h1>Secret</h1>
<input id="pass" type="password" inputmode="numeric" placeholder="ДДММГГ">
<button onclick="checkPassword()">Войти</button>
<p id="err"></p>
</div>
</div>

<div id="s3" class="screen hidden">
<div class="card">
<h1 style="font-size:28px">Открыто 🤍</h1>
</div>
</div>

<script>

function goTo2(){
document.getElementById('s1').classList.add('hidden');
document.getElementById('s2').classList.remove('hidden');
}

function checkPassword(){
const input=document.getElementById('pass').value.trim();
const err=document.getElementById('err');

if(input==="201025"){
if(navigator.vibrate) navigator.vibrate([50,30,50]);
document.getElementById('s2').classList.add('hidden');
document.getElementById('s3').classList.remove('hidden');
}else{
err.innerText="Неверная дата, балам";
}
}

</script>

</body>
</html>
