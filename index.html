<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Diary of Love</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root{
--bg:#1c1412;
--page:#fffcf9;
--text:#3d302d;
--gold:#e5b89d;
--cover:#32161a;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}

body{
height:100dvh;
background:radial-gradient(circle at center,#2a1b18 0%,#0b0706 100%);
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
font-family:'Cormorant Garamond',serif;
perspective:1200px;
}

#flow{
position:fixed;inset:0;pointer-events:none;
}

.flow{
position:absolute;
color:rgba(229,184,157,.4);
font-style:italic;
white-space:nowrap;
}

.screen{
position:absolute;inset:0;
display:flex;
align-items:center;
justify-content:center;
transition:.6s;
}

.hidden{opacity:0;pointer-events:none}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
padding:40px 28px;
border-radius:28px;
text-align:center;
border:1px solid rgba(255,255,255,.1);
width:90%;
max-width:340px;
}

h1{
font-family:'Great Vibes';
color:var(--gold);
font-size:42px;
margin-bottom:20px;
}

button{
padding:14px 22px;
border-radius:12px;
border:none;
background:var(--gold);
color:#000;
font-weight:600;
letter-spacing:2px;
cursor:pointer;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:none;
text-align:center;
font-size:18px;
margin-bottom:15px;
}

.book{
width:380px;
max-width:92vw;
height:85dvh;
position:relative;
}

.page{
position:absolute;
inset:0;
background:var(--page);
color:var(--text);
padding:30px 22px;
border-radius:18px;
opacity:0;
transform:rotateY(40deg);
transform-origin:left;
transition:.7s;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.page.active{opacity:1;transform:rotateY(0deg);z-index:3}
.page.flipped{opacity:0;transform:rotateY(-140deg);z-index:1}

.cover{
background:var(--cover);
color:var(--gold);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.cover-inner{
border:1px solid var(--gold);
padding:30px;
width:90%;
height:90%;
display:flex;
flex-direction:column;
justify-content:center;
gap:10px;
}

.text{
font-size:18px;
font-style:italic;
line-height:1.6;
text-align:center;
}

.nav{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
}

.arrow{
font-size:30px;
background:none;
color:var(--text);
}

.timer{
font-size:13px;
color:#9a7a6b;
}

.menu{
position:fixed;inset:0;
background:rgba(0,0,0,.6);
backdrop-filter:blur(10px);
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
}

.menu.active{display:flex}

.menu button{
margin:8px;
width:220px;
}
</style>
</head>

<body>

<div id="flow"></div>

<div id="s1" class="screen">
<div class="card">
<h1>For my baby</h1>
<button onclick="start()">Открыть</button>
</div>
</div>

<div id="s2" class="screen hidden">
<div class="card">
<h1>Secret</h1>
<input id="pass" type="password" inputmode="numeric" placeholder="ДДММГГ">
<button onclick="check()">Войти</button>
<p id="err" style="color:var(--gold);margin-top:10px"></p>
</div>
</div>

<div id="s3" class="screen hidden">
<div class="book" id="book">

<div class="page cover active" id="p0">
<div class="cover-inner" id="cover">
<div style="font-size:12px;letter-spacing:3px">MEMORIES</div>
<div style="font-family:Great Vibes;font-size:48px">Diary of Love</div>
<div>✦ 🤍 ✦</div>
<div>Seven Months</div>
<button onclick="go(1)">Читать</button>
</div>
</div>

</div>
</div>

<div class="menu" id="menu">
<button onclick="jump(1)">1. Больше, чем цифры</button>
<button onclick="jump(6)">2. Вспышки в памяти</button>
<button onclick="jump(15)">3. До каждого столба</button>
<button onclick="jump(20)">4. Секунда на документы</button>
<button onclick="jump(22)">5. Не из фильмов</button>
<button onclick="jump(32)">6. Точка невозврата</button>
<button onclick="jump(35)">7. Дорога</button>
</div>

<audio id="music" src="Shape.mp3" loop></audio>

<script>

const texts=[
"Нам 7 месяцев и я до сих пор не верю в это",
"Это больше чем цифра",
"Это целая маленькая жизнь",
"Мы не идеальные",
"Но всегда возвращаемся",
"Даже когда больно",
"Мы скучаем друг по другу",
"И это сильнее всего",
"Я помню наши обнимашки",
"У кресента всё остановилось",
"Были только ты и я",
"Ты пришла с переживаниями",
"Но осталась рядом",
"И мир исчез",
"Я целовал твои ручки",
"И это было важно",
"Каждое прикосновение",
"Как признание",
"Подъезд математики",
"Последний момент",
"И ты в моих руках",
"Ляман и наши обнимашки",
"Мы живые настоящие",
"Поцелуи щёчки руки",
"Тёплые моменты внутри",
"Ты мне очень важна",
"Я с тобой настоящий",
"Без масок",
"Со всеми ошибками",
"Ты всё это видела",
"И осталась",
"Я горжусь тобой",
"И тобой как своей девушкой",
"Обычная пара не выдержала бы",
"А мы растём",
"И становимся ближе",
"Дом жизнь свадьба",
"Мы уже идём туда",
"Я верю в нас 🤍"
];

let current=0;

function build(){
const book=document.getElementById('book');
texts.forEach((t,i)=>{
const d=document.createElement('div');
d.className='page';
d.id='p'+(i+1);
d.innerHTML=`
<div class="text">${t}</div>
<div class="nav">
<button class="arrow" onclick="prev()">‹</button>
<div class="timer" id="tm"></div>
<button class="arrow" onclick="next()">›</button>
</div>`;
book.appendChild(d);
});
update();
}

function update(){
document.querySelectorAll('.page').forEach((p,i)=>{
if(i===current)p.className='page active';
else if(i<current)p.className='page flipped';
else p.className='page';
});
if(navigator.vibrate)navigator.vibrate(20);
}

function next(){if(current<texts.length)current++;update()}
function prev(){if(current>0)current--;update()}
function go(i){current=i;update();toggleMenu(false)}
function jump(i){current=i;update();toggleMenu(false)}

function start(){
document.getElementById('s1').classList.add('hidden');
document.getElementById('s2').classList.remove('hidden');
document.getElementById('music').play();
}

function check(){
if(document.getElementById('pass').value==="201025"){
navigator.vibrate([50,30,50]);
document.getElementById('s2').classList.add('hidden');
document.getElementById('s3').classList.remove('hidden');
build();
setInterval(timer,1000);
}else{
document.getElementById('err').innerText="Неверная дата, балам";
}
}

function timer(){
const s=new Date('2025-10-20T22:47:00');
const n=new Date();
const d=Math.floor((n-s)/86400000);
const h=Math.floor(((n-s)%86400000)/3600000);
const m=Math.floor(((n-s)%3600000)/60000);
const sc=Math.floor(((n-s)%60000)/1000);
document.querySelectorAll('.timer').forEach(e=>e.innerText=`${d}д ${h}ч ${m}м ${sc}с`);
}

function toggleMenu(v){
document.getElementById('menu').classList.toggle('active',v);
}

setInterval(()=>{if(Math.random()>0.7){
const f=document.createElement('div');
f.className='flow';
f.innerText=Math.random()>0.5?"E🤍":"forever";
f.style.left=Math.random()*100+'vw';
f.style.top='-20px';
document.getElementById('flow').appendChild(f);
f.animate([{transform:'translateY(0)'},{transform:'translateY(110vh)'}],{duration:9000});
setTimeout(()=>f.remove(),9000);
}},800);

</script>
</body>
</html>
